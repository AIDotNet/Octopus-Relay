name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  binaries:
    name: build binary (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure NativeAOT linker (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Publish NativeAOT
        shell: bash
        run: |
          dotnet publish src/Octopus.Relay \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=None \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o out

      - name: Archive (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/octopus-relay-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz" -C out octopus-relay

      - name: Archive (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/octopus-relay.exe -DestinationPath "dist/octopus-relay-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: dist/*

  docker-build:
    name: build Docker image (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image & version
        id: info
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.0.0"; fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.info.outputs.version }}
          outputs: type=image,name=${{ steps.info.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: publish multi-arch Docker manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS_LIST: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAGS+=("-t" "$tag")
          done <<< "$TAGS_LIST"
          SOURCES=()
          for f in *; do
            SOURCES+=("${IMAGE}@sha256:${f}")
          done
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#v}"

  publish-release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, docker-merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: (cd artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Octopus Relay ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${EXTRA[@]}"
