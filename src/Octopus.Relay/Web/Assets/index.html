<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Octopus Relay</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/account">
        <span class="brand-mark" aria-hidden="true">O</span>
        <span class="brand-name" id="brand-name">Octopus Relay</span>
        <span class="badge badge-muted" id="brand-version"></span>
      </a>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="lang-toggle">EN</button>
        <button type="button" class="btn btn-ghost btn-sm hidden" id="nav-logout"></button>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="card center-card">
      <p class="muted" id="loading-text">Loading…</p>
    </div>
  </main>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
